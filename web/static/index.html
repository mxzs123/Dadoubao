<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceBridge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, sans-serif;
            padding: 15px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }
        .status {
            text-align: center;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 14px;
        }
        .status.connected { background: #d4edda; color: #155724; }
        .status.connecting { background: #fff3cd; color: #856404; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        textarea {
            flex: 1;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            background: white;
        }
        textarea:focus { border-color: #007bff; outline: none; }
        .options {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            gap: 8px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }
        .options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .hint {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div id="status" class="status connecting">○ 连接中...</div>
    <textarea id="input" placeholder="点击这里，使用语音输入，回车发送..." autofocus></textarea>
    <div class="options">
        <label>
            <input type="checkbox" id="autoEnter" checked>
            粘贴后自动回车（发送消息）
        </label>
    </div>
    <div class="hint">回车发送 | Shift+回车换行</div>

    <script>
        const statusEl = document.getElementById('status');
        const inputEl = document.getElementById('input');
        const autoEnterEl = document.getElementById('autoEnter');

        let ws = null;
        let reconnectTimer = null;

        function connect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            statusEl.className = 'status connecting';
            statusEl.textContent = '○ 连接中...';

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                statusEl.className = 'status connected';
                statusEl.textContent = '● 已连接';
            };

            ws.onclose = () => {
                statusEl.className = 'status disconnected';
                statusEl.textContent = '✕ 已断开';
                // 3秒后自动重连
                reconnectTimer = setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'ack' && msg.success) {
                    inputEl.value = '';
                }
            };
        }

        function send() {
            const text = inputEl.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'text',
                    payload: text,
                    autoEnter: autoEnterEl.checked
                }));
            }
        }
        
        inputEl.addEventListener('keydown', (e) => {
            // 回车发送（不带 Shift）
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
        
        // 点击状态栏手动重连
        statusEl.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connect();
            }
        });
        
        // 心跳保活
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
        
        connect();
    </script>
</body>
</html>
